[package]
name = "metal-programs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Programs that run on Metal OS as ordinary tasks (started with SPAWN from images in the system partition)"

[workspace]

[dependencies]
metal-loader = { path = "../libs/metal-loader" }
metal-map = { path = "../libs/metal-map" }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
