[package]
name = "metal-programs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Programs that run on Metal OS as ordinary tasks (started with SPAWN from images in the system partition)"

[workspace]

[dependencies]
metal-loader = { path = "../libs/metal-loader" }
metal-map = { path = "../libs/metal-map" }
# the desktop's programs (desktop, settings, files, taskmgr, capmgr): the crates of the metal-os-desktop repository
metal-desktop = { git = "https://github.com/anthonydarkoonx/metal-os-desktop" }
metal-settings = { git = "https://github.com/anthonydarkoonx/metal-os-desktop" }
metal-files = { git = "https://github.com/anthonydarkoonx/metal-os-desktop" }
metal-taskmgr = { git = "https://github.com/anthonydarkoonx/metal-os-desktop" }
metal-capmgr = { git = "https://github.com/anthonydarkoonx/metal-os-desktop" }
metal-ui = { git = "https://github.com/anthonydarkoonx/metal-os-desktop" }
metal-desktop-proto = { git = "https://github.com/anthonydarkoonx/metal-os-desktop" }
metal-compositor-os = { git = "https://github.com/anthonydarkoonx/metal-os-desktop" }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"

# the desktop crates take these from GitHub; this tree uses its own copies (one of each in the build)
[patch."https://github.com/anthonydarkoonx/metal-os"]
metal-gfx = { path = "../libs/metal-gfx" }
metal-driver-rt = { path = "../libs/metal-driver-rt" }
