[package]
name = "metal-user"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

[workspace]

[dependencies]
metal-erofs = { path = "../libs/metal-erofs" }
metal-lfs = { path = "../libs/metal-lfs" }
metal-loader = { path = "../libs/metal-loader" }
metal-net = { path = "../libs/metal-net" }
metal-gfx = { path = "../libs/metal-gfx" }
metal-input = { path = "../libs/metal-input" }
metal-edit = { path = "../libs/metal-edit" }
metal-compact = { path = "../libs/metal-compact" }
metal-driver-rt = { path = "../libs/metal-driver-rt" }
# the desktop (the screen task is the compositor): its crates are the metal-os-desktop repository
metal-compositor-os = { git = "https://github.com/anthonydarkoonx/metal-os-desktop" }
metal-ui = { git = "https://github.com/anthonydarkoonx/metal-os-desktop" }
metal-desktop-proto = { git = "https://github.com/anthonydarkoonx/metal-os-desktop" }

[profile.release]
panic = "abort"
# the kernel gives every boot task a private copy of this image: small matters (about 26 copies). The drawing crates, where the
# console spends its time, are optimised for speed instead.
opt-level = "s"
lto = true
codegen-units = 1

[profile.release.package.metal-gfx]
opt-level = 3

[profile.dev]
panic = "abort"

# the desktop crates take these from GitHub; this tree uses its own copies (one of each in the build)
[patch."https://github.com/anthonydarkoonx/metal-os"]
metal-gfx = { path = "../libs/metal-gfx" }
metal-driver-rt = { path = "../libs/metal-driver-rt" }
